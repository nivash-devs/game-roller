<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Roller</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@700&display=swap">
<style>
/* Layout: a headline, then one big blank that rolls. Only the blank rolls, and only when space is pressed. Pure black and white. */
:root {
  color-scheme: dark;
  --bg: #000000; --ink: #ffffff; --muted: #8a8a8a; --mark: #ffffff; --mark-ink: #000000;
  --big: clamp(40px, min(9.5vw, 15vh), 150px);
  --f-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-display); overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#stage { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(16px, 3.5vh, 44px); text-align: center; }
h1 { margin: 0; font-weight: 700; font-size: clamp(30px, min(6vw, 9vh), 92px); line-height: 1.02; letter-spacing: -0.035em; text-wrap: balance; max-width: 15em; opacity: 0; transform: translateY(24px); }
#line { --row: 1.3em; display: flex; align-items: center; justify-content: center; gap: 0.28em; font-size: var(--big); font-weight: 700; letter-spacing: -0.035em; line-height: 1; white-space: nowrap; opacity: 0; }
#win { position: relative; width: 5.2em; height: calc(var(--row) * 3); overflow: hidden; }
#mark { position: absolute; left: 0; right: 0; top: var(--row); height: var(--row); background: var(--mark); transform: scaleX(0); transform-origin: left center; }
#blank, #reel { transition: opacity 0.14s; }
#blank { position: absolute; left: 0; right: 0; top: var(--row); height: var(--row); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 0.3em; }
#blank i { display: block; width: 3.9em; height: 0.095em; background: var(--ink); }
#reel { position: absolute; left: 0; right: 0; top: 0; opacity: 0; will-change: transform; }
.row { height: var(--row); display: flex; align-items: center; justify-content: center; }
#hint { font: 500 clamp(12px, 1.5vw, 19px)/1 var(--f-mono); color: var(--muted); letter-spacing: 0.06em; transition: opacity 0.4s; min-height: 1em; }
@media (prefers-reduced-motion: reduce) { h1 { transform: none; } #blank, #reel { transition: none; } }
</style>

<div id="stage">
  <h1>Can I make this?</h1>
  <div id="line" aria-live="polite"><div id="win"><div id="mark"></div><div id="blank"><i></i></div><div id="reel"></div></div></div>
  <div id="hint">PRESS SPACE TO ROLL</div>
</div>

<script>
(function () {
  var BASE = [
    "notes", "weather", "habit", "chat", "music", "quiz", "timer", "photo", "fitness", "maps",
    "mail", "todo", "camera", "video", "radio", "podcast", "banking", "travel", "recipes", "shopping",
    "calendar", "diary", "budget", "taxi", "flights", "hotels", "movies", "news", "sports", "stocks",
    "crypto", "wallet", "dating", "social", "chess", "trivia", "karaoke", "scanner", "browser", "clock",
    "alarm", "compass", "tutor", "coding", "reader", "books", "comics", "drawing", "editor", "collage",
    "filters", "stickers", "memes", "fasting", "sleep", "yoga", "running", "cycling", "hiking", "golf",
    "tennis", "fishing", "garden", "pets", "plants", "cooking", "grocery", "coupons", "parking", "transit",
    "delivery", "rentals", "jobs", "resume", "invoice", "expenses", "tickets", "events", "polls", "forms",
    "survey", "voting", "charity", "prayer", "quotes", "jokes", "walkie", "wii"
  ];
  // Shuffle the order each time the page loads, but keep "wii" away from the very start and end of the list.
  var ITEMS = BASE.slice();
  for (var i = ITEMS.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), tmp = ITEMS[i]; ITEMS[i] = ITEMS[j]; ITEMS[j] = tmp; }
  (function () { var w = ITEMS.indexOf("wii"), mid = Math.floor(ITEMS.length / 2); if (w < 3 || w > ITEMS.length - 4) { ITEMS[w] = ITEMS[mid]; ITEMS[mid] = "wii"; } })();
  var TARGET = ITEMS.indexOf("wii");          // every roll lands on "wii"
  var LOOPS = 4, DUR = 3.8;                    // reel length, and how long a roll takes (seconds)
  var REST = "PRESS SPACE TO ROLL", DONE = "SPACE ROLLS AGAIN. R RESETS. M MUTES";
  var $ = function (id) { return document.getElementById(id); };
  var clamp = function (x) { return Math.min(1, Math.max(0, x)); };
  // The motion-design skill's ease-out-quart curve: cubic-bezier(.165, .84, .44, 1)
  var ease = (function (x1, y1, x2, y2) {
    var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    return function (t) { if (t <= 0) return 0; if (t >= 1) return 1; var u = t;
      for (var i = 0; i < 10; i++) { var x = ((ax * u + bx) * u + cx) * u - t, dx = (3 * ax * u + 2 * bx) * u + cx; if (Math.abs(x) < 1e-7 || Math.abs(dx) < 1e-7) break; u -= x / dx; }
      return ((ay * u + by) * u + cy) * u; };
  })(0.165, 0.84, 0.44, 1);
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Sound: made live with the Web Audio API, so there are no files to load. A key press unlocks it.
  var AC = window.AudioContext || window.webkitAudioContext, ac = null, muted = false;
  function audio() {
    if (!AC) return null;
    if (!ac) { try { ac = new AC(); } catch (e) { return null; } }
    if (ac.state === "suspended") { try { ac.resume().catch(function () {}); } catch (e) {} }
    return ac;
  }
  function live() { var a = audio(); return a && a.state === "running" && !muted ? a : null; }
  function blip(a, type, f0, f1, vol, dur, at, cut) {      // one short tone with a fast fade
    var t = a.currentTime + (at || 0), o = a.createOscillator(), g = a.createGain(), lp = a.createBiquadFilter();
    o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    lp.type = "lowpass"; lp.frequency.value = cut || 4000;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(lp); lp.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function playTick() { var a = live(); if (a) blip(a, "triangle", 1500 + Math.random() * 250, 1100, 0.09, 0.03, 0, 3200); }
  function playLand() { var a = live(); if (!a) return; blip(a, "sine", 150, 52, 0.55, 0.24, 0, 800); blip(a, "sine", 988, 988, 0.07, 0.55, 0.04, 6000); blip(a, "triangle", 1976, 1976, 0.025, 0.4, 0.04, 6000); }

  var reel = $("reel"), rows = [];
  for (var l = 0; l < LOOPS; l++) ITEMS.forEach(function (t) { var r = document.createElement("div"); r.className = "row"; r.textContent = t; reel.appendChild(r); rows.push(r); });

  var raf = 0, startAt = 0, from = 0, to = 0, landed = -1, rolled = false, busy = false, hintBase = REST, hintTimer = 0;
  function rowPx() { return rows[0].getBoundingClientRect().height; }
  function setHint(text, on) { $("hint").textContent = text; $("hint").style.opacity = on ? 1 : 0; }
  function paint(pos, win) {
    var h = rowPx(); reel.style.transform = "translateY(" + (-pos * h) + "px)";
    var c = pos + 1;                          // the middle row of three
    for (var i = Math.max(0, Math.floor(pos) - 1); i < Math.min(rows.length, Math.ceil(pos) + 4); i++) {
      var d = Math.abs(i - c);
      rows[i].style.opacity = Math.max(0.12, 1 - d * 0.62);
      rows[i].style.color = (win && i === landed) ? "var(--mark-ink)" : "var(--ink)";
    }
  }
  function roll() {
    if (busy) return;                           // ignore presses while it is rolling
    busy = true; clearTimeout(hintTimer); cancelAnimationFrame(raf);
    landed = -1; $("mark").style.transform = "scaleX(0)"; rows.forEach(function (r) { r.style.color = "var(--ink)"; });
    var n = ITEMS.length; from = rolled ? TARGET - 1 + n : Math.floor(Math.random() * n); rolled = true;
    landed = (LOOPS - 2) * n + TARGET; to = landed - 1;     // land the winner in the middle row
    startAt = performance.now();
    paint(from, false); $("blank").style.opacity = 0; reel.style.opacity = 1; setHint(hintBase, false);
    if (reduce) { paint(to, true); $("mark").style.transform = "scaleX(1)"; finish(); return; }
    var prevPos = from, prevT = 0, lastF = Math.floor(from), lastTickAt = -1, landFx = false;
    reel.style.filter = "none";
    (function tick(now) {
      var t = (now - startAt) / 1000, p = ease(clamp(t / DUR)), pos = from + (to - from) * p;
      paint(pos, false);
      var speed = t > prevT ? Math.abs(pos - prevPos) / (t - prevT) : 0;           // rows per second
      prevPos = pos; prevT = t;
      // a tick each time a word passes the middle (never faster than about 35 a second)
      var f = Math.floor(pos); if (f !== lastF) { lastF = f; if (t - lastTickAt > 0.028) { lastTickAt = t; playTick(); } }
      // motion blur while it is fast
      reel.style.filter = speed > 4 ? "blur(" + Math.min(2.5, speed / 45).toFixed(2) + "px)" : "none";
      // the white bar sweeps in as the reel settles, and the winning word fades to black
      var m = ease(clamp((t - (DUR - 0.5)) / 0.55)); $("mark").style.transform = "scaleX(" + m + ")";
      var cm = clamp((m - 0.25) / 0.5), v = Math.round(255 * (1 - cm)); if (cm > 0) rows[landed].style.color = "rgb(" + v + "," + v + "," + v + ")";
      if (!landFx && t >= DUR - 0.02) { landFx = true; playLand(); }      // a thump and a chime
      if (t < DUR + 0.6) raf = requestAnimationFrame(tick);
      else { paint(to, true); reel.style.filter = "none"; finish(); }
    })(performance.now());
  }
  function finish() { busy = false; hintBase = DONE; hintTimer = setTimeout(function () { setHint(DONE, true); }, 1200); }
  function reset() {                             // back to "a _______ game"
    cancelAnimationFrame(raf); clearTimeout(hintTimer); busy = false; rolled = false; landed = -1;
    $("mark").style.transform = "scaleX(0)"; reel.style.opacity = 0; reel.style.filter = "none"; $("blank").style.opacity = 1;
    rows.forEach(function (r) { r.style.color = "var(--ink)"; }); hintBase = REST; setHint(REST, true);
  }

  // Intro: the headline rises in and the line fades up. Nothing rolls until space is pressed.
  (function intro() {
    var h1 = document.querySelector("h1"), line = $("line"), t0 = performance.now();
    (function f(now) {
      var t = (now - t0) / 1000, a = ease(clamp(t / 0.6)), b = ease(clamp((t - 0.25) / 0.6));
      h1.style.opacity = a; h1.style.transform = "translateY(" + (24 * (1 - a)) + "px)"; line.style.opacity = b;
      if (t < 1.0) requestAnimationFrame(f); else { h1.style.opacity = 1; h1.style.transform = "none"; line.style.opacity = 1; }
    })(t0);
    paint(0, false);
  })();

  document.addEventListener("keydown", function (e) {
    var k = e.key;
    if (k === "m" || k === "M") { muted = !muted; $("hint").textContent = muted ? "SOUND OFF. PRESS M FOR SOUND" : hintBase; $("hint").style.opacity = 1; return; }
    if (k === " " || k === "Enter") { e.preventDefault(); audio(); roll(); }
    else if (k === "r" || k === "R" || k === "Escape" || k === "Backspace") { e.preventDefault(); reset(); }
  });
  window.addEventListener("resize", function () { if (landed >= 0 && !busy) paint(to, true); });
})();
</script>

</body>
</html>
