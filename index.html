<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Roller</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@700&display=swap">
<style>
/* Layout: one centred column. A headline, then a three-row reel whose middle row is the "winner" row. Dark and flat, one yellow marker. */
:root {
  color-scheme: dark;
  --bg: #000000; --ink: #ffffff; --muted: #8a8a8a; --line: #2a2a2a; --mark: #ffffff; --mark-ink: #000000;
  --row: clamp(64px, 11vw, 140px);
  --f-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-display); overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#stage { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(20px, 4vw, 48px); text-align: center; cursor: pointer; }
h1 { margin: 0; font-weight: 700; font-size: clamp(34px, 6vw, 92px); line-height: 1.02; letter-spacing: -0.035em; text-wrap: balance; max-width: 15em; opacity: 0; transform: translateY(24px); }
h1 em { font-style: normal; background: var(--mark); color: var(--mark-ink); border-radius: 0; padding: 0 0.14em; }
#win { position: relative; width: min(100%, 1100px); height: calc(var(--row) * 3); overflow: hidden; opacity: 0; }
#mark { position: absolute; left: 0; right: 0; top: var(--row); height: var(--row); background: var(--mark); border-radius: 0; transform: scaleX(0); transform-origin: left center; }
#reel { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
.row { height: var(--row); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: calc(var(--row) * 0.52); letter-spacing: -0.03em; white-space: nowrap; }
#hint { font: 500 clamp(13px, 1.6vw, 20px)/1 var(--f-mono); color: var(--muted); letter-spacing: 0.06em; transition: opacity 0.6s; }
@media (prefers-reduced-motion: reduce) { h1 { transform: none; } }
</style>

<div id="stage">
  <h1>What game do I build today?</h1>
  <div id="win" aria-live="polite"><div id="mark"></div><div id="reel"></div></div>
  <div id="hint">CLICK OR PRESS SPACE TO ROLL AGAIN. M MUTES</div>
</div>

<script>
(function () {
  var ITEMS = ["a snake game", "a platformer", "a memory game", "a space shooter", "a puzzle game", "a racing game", "a clicker game", "a quiz game", "a pong game", "a maze game", "a card game", "a rhythm game", "a runner game", "a tower defense"];
  var FIRST = ITEMS.indexOf("a platformer");   // every roll lands on "a platformer"
  var LOOPS = 9, DUR = 3.8;           // reel length, and how long the roll takes (seconds)
  var $ = function (id) { return document.getElementById(id); };
  var clamp = function (x) { return Math.min(1, Math.max(0, x)); };
  // The motion-design skill's ease-out-quart curve: cubic-bezier(.165, .84, .44, 1)
  var ease = (function (x1, y1, x2, y2) {
    var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    return function (t) { if (t <= 0) return 0; if (t >= 1) return 1; var u = t;
      for (var i = 0; i < 10; i++) { var x = ((ax * u + bx) * u + cx) * u - t, dx = (3 * ax * u + 2 * bx) * u + cx; if (Math.abs(x) < 1e-7 || Math.abs(dx) < 1e-7) break; u -= x / dx; }
      return ((ay * u + by) * u + cy) * u; };
  })(0.165, 0.84, 0.44, 1);
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Sound: made live with the Web Audio API, so there are no files to load. Browsers keep it silent until the page has been clicked or a key pressed.
  var AC = window.AudioContext || window.webkitAudioContext, ac = null, muted = false;
  function audio() {
    if (!AC) return null;
    if (!ac) { try { ac = new AC(); } catch (e) { return null; } }
    if (ac.state === "suspended") { try { ac.resume().catch(function () {}); } catch (e) {} }
    return ac;
  }
  function live() { var a = audio(); return a && a.state === "running" && !muted ? a : null; }
  function blip(a, type, f0, f1, vol, dur, at, cut) {      // one short tone with a fast fade
    var t = a.currentTime + (at || 0), o = a.createOscillator(), g = a.createGain(), lp = a.createBiquadFilter();
    o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    lp.type = "lowpass"; lp.frequency.value = cut || 4000;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(lp); lp.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function playTick() { var a = live(); if (a) blip(a, "triangle", 1500 + Math.random() * 250, 1100, 0.09, 0.03, 0, 3200); }
  function playLand() { var a = live(); if (!a) return; blip(a, "sine", 150, 52, 0.55, 0.24, 0, 800); blip(a, "sine", 988, 988, 0.07, 0.55, 0.04, 6000); blip(a, "triangle", 1976, 1976, 0.025, 0.4, 0.04, 6000); }

  var reel = $("reel"), rows = [];
  for (var l = 0; l < LOOPS; l++) ITEMS.forEach(function (t) { var r = document.createElement("div"); r.className = "row"; r.textContent = t; reel.appendChild(r); rows.push(r); });

  var raf = 0, startAt = 0, from = 0, to = 0, landed = -1, last = FIRST, rolled = false;
  function rowPx() { return rows[0].getBoundingClientRect().height; }
  function paint(pos, win) {
    var h = rowPx(); reel.style.transform = "translateY(" + (-pos * h) + "px)";
    var c = pos + 1;                          // the middle row of three
    for (var i = Math.max(0, Math.floor(pos) - 1); i < Math.min(rows.length, Math.ceil(pos) + 4); i++) {
      var d = Math.abs(i - c);
      rows[i].style.opacity = Math.max(0.12, 1 - d * 0.62);
      rows[i].style.color = (win && i === landed) ? "var(--mark-ink)" : "var(--ink)";
    }
  }
  function roll(target) {
    cancelAnimationFrame(raf);
    landed = -1; $("mark").style.transform = "scaleX(0)"; rows.forEach(function (r) { r.style.color = "var(--ink)"; });
    var n = ITEMS.length; from = rolled ? last - 1 + n : Math.floor(Math.random() * n); rolled = true;
    landed = (LOOPS - 2) * n + target; to = landed - 1;    // land the winner in the middle row
    last = target; startAt = performance.now();
    $("hint").style.opacity = 0;
    if (reduce) { paint(to, true); $("mark").style.transform = "scaleX(1)"; return; }
    var prevPos = from, prevT = 0, lastF = Math.floor(from), lastTickAt = -1, landFx = false, win = $("win");
    reel.style.filter = "none";
    (function tick(now) {
      var t = (now - startAt) / 1000, p = ease(clamp(t / DUR)), pos = from + (to - from) * p;
      paint(pos, false);
      var speed = t > prevT ? Math.abs(pos - prevPos) / (t - prevT) : 0;           // rows per second
      prevPos = pos; prevT = t;
      // a tick each time a game passes the middle (never faster than about 35 a second)
      var f = Math.floor(pos); if (f !== lastF) { lastF = f; if (t - lastTickAt > 0.028) { lastTickAt = t; playTick(); } }
      // motion blur while it is fast
      if (!reduce) reel.style.filter = speed > 4 ? "blur(" + Math.min(2.5, speed / 45).toFixed(2) + "px)" : "none";
      // the marker sweeps in as the reel settles
      var m = ease(clamp((t - (DUR - 0.5)) / 0.55)); $("mark").style.transform = "scaleX(" + m + ")";
      var cm = clamp((m - 0.25) / 0.5), v = Math.round(255 * (1 - cm)); if (cm > 0) rows[landed].style.color = "rgb(" + v + "," + v + "," + v + ")";
      // landing: a thump and a chime
      if (!landFx && t >= DUR - 0.02) { landFx = true; playLand(); }
      if (t < DUR + 0.6) raf = requestAnimationFrame(tick);
      else { paint(to, true); reel.style.filter = "none"; setTimeout(function () { $("hint").style.opacity = 1; }, 1200); }
    })(performance.now());
  }
  function again() { roll(FIRST); }

  // Intro: the headline rises in, the reel fades up, then the first roll starts
  function intro() {
    var h1 = document.querySelector("h1"), win = $("win"), t0 = performance.now();
    (function f(now) {
      var t = (now - t0) / 1000, a = ease(clamp(t / 0.6)), b = ease(clamp((t - 0.25) / 0.6));
      h1.style.opacity = a; h1.style.transform = "translateY(" + (24 * (1 - a)) + "px)"; win.style.opacity = b;
      if (t < 1.0) requestAnimationFrame(f); else { h1.style.opacity = 1; h1.style.transform = "none"; win.style.opacity = 1; }
    })(t0);
    paint(Math.floor(Math.random() * ITEMS.length), false);
    setTimeout(function () { roll(FIRST); }, 700);
  }
  $("stage").addEventListener("click", function () { audio(); again(); });
  document.addEventListener("keydown", function (e) { if (e.key === "m" || e.key === "M") { muted = !muted; $("hint").textContent = muted ? "SOUND OFF. PRESS M FOR SOUND" : "CLICK OR PRESS SPACE TO ROLL AGAIN. M MUTES"; $("hint").style.opacity = 1; return; } audio(); if (e.code === "Space" || e.key === "Enter" || e.key === "r" || e.key === "R") { e.preventDefault(); again(); } });
  window.addEventListener("resize", function () { if (landed >= 0 && performance.now() - startAt > DUR * 1000) paint(to, true); });
  audio();
  intro();
})();
</script>

</body>
</html>
